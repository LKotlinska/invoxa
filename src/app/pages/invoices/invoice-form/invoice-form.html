<form [formGroup]="invoiceForm" (ngSubmit)="onSubmit()">
  <div class="info-container">
    <div class="info-fields">
      <h3>Customer information</h3>
      <app-filter-auto-select
        label="Customer email"
        placeholder="eric@example.com"
        type="email"
        [myControl]="invoiceForm.controls.controlEmail"
        [options]="(customers$ | async) ?? []"
        [displayFn]="displayCustomer"
        (optionSelected)="onCustomerSelected($event)"
        required
      />
      <app-outlined-input
        [myControl]="invoiceForm.controls.controlFullName"
        label="Full name"
        type="email"
        required
        placeholder="Eric Johansson"
      />
      <app-outlined-input
        [myControl]="invoiceForm.controls.controlStreetName"
        label="Street name and nr"
        type="text"
        placeholder="Kungsgatan 12"
      />
      <app-outlined-input
        [myControl]="invoiceForm.controls.controlPostalCode"
        label="Postal code"
        type="number"
        placeholder="81254"
      />
      <app-outlined-input
        [myControl]="invoiceForm.controls.controlCity"
        label="City"
        type="text"
        placeholder="Stockholm"
      />
      <app-outlined-input
        [myControl]="invoiceForm.controls.controlCountry"
        label="Country"
        type="text"
        placeholder="Sweden"
      />
    </div>
    <div class="info-fields">
      <h3>Invoice information</h3>
      <app-outlined-input
        [myControl]="invoiceForm.controls.controlDate"
        label="Date"
        type="date"
        placeholder="Sweden"
      />
      <app-select-input
        [myControl]="invoiceForm.controls.controlPayment"
        label="Payment method"
        [items]="paymentMethods"
      />
      <app-outlined-input
        [myControl]="invoiceForm.controls.controlDueDate"
        label="Due date"
        type="date"
        placeholder="Sweden"
      />
    </div>
  </div>
  <div>
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track row; let i = $index) {
          <tr [formGroup]="row">
            <td>
              <app-outlined-input
                label="Product id"
                type="number"
                [myControl]="row.controls.id"
                aria-disabled="true"
                readonly
              />
            </td>
            <td>
              <app-filter-auto-select
                label="Product name"
                placeholder="Bread"
                type="text"
                [myControl]="row.controls.name"
                [options]="(products$ | async) ?? []"
                [displayFn]="displayProduct"
                (optionSelected)="onProductSelected($event, row)"
              />
            </td>
            <td>
              <app-outlined-input
                label="Price"
                placeholder="119"
                type="number"
                [myControl]="row.controls.price"
              />
            </td>
            <td>
              <app-outlined-input
                label="Quantity"
                placeholder="5"
                type="number"
                [myControl]="row.controls.qty"
              />
            </td>
            <td>{{ rowCost$(row) | async }}</td>
            <td>
              <button type="button" (click)="removeRow($index)" matButton>- Remove product</button>
            </td>
          </tr>
        }
        <button type="button" (click)="addRow()" matButton>+ New product</button>
      </tbody>
      <button type="submit" [disabled]="!invoiceForm.valid">Submit</button>
    </table>
  </div>
</form>
